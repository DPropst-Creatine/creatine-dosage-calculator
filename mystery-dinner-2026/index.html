        body {

            background-color: #fdf8f5;
            color: #333;
        }

        .tab-btn {
            transition: all 0.3s ease;
        }
        
        .tab-btn.active {
            background-color: #e63946;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 6px rgba(230, 57, 70, 0.3);
        }

        .menu-card {
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Staggered animation delays for items */
        .menu-card:nth-child(1) { animation-delay: 0.1s; }
        .menu-card:nth-child(2) { animation-delay: 0.2s; }
        .menu-card:nth-child(3) { animation-delay: 0.3s; }
        .menu-card:nth-child(4) { animation-delay: 0.4s; }
        .menu-card:nth-child(5) { animation-delay: 0.5s; }
        .menu-card:nth-child(6) { animation-delay: 0.6s; }
        .menu-card:nth-child(7) { animation-delay: 0.7s; }
        .menu-card:nth-child(8) { animation-delay: 0.8s; }

        .price-badge {
            background: linear-gradient(135deg, #f4a261, #e76f51);
        }
    </style>

        let currentTab = 'standards';

        const tabsContainer = document.getElementById('tabs-container');
        const menuGrid = document.getElementById('menu-grid');
        const sectionTitle = document.getElementById('section-title');
        const sectionNote = document.getElementById('section-note');

        // Initialize Tabs
        function initTabs() {
            menuData.forEach(category => {
                const btn = document.createElement('button');
                btn.className = `tab-btn px-6 py-3 rounded-full font-semibold text-sm md:text-base border-2 border-transparent bg-white text-[#1d3557] shadow-sm hover:shadow-md flex items-center gap-2 ${category.id === currentTab ? 'active' : ''}`;
                btn.innerHTML = `<i class="fas ${category.icon}"></i> ${category.title}`;
                btn.onclick = () => switchTab(category.id);
                tabsContainer.appendChild(btn);
            });
        }

        // Switch Tab and Render Items
        function switchTab(tabId) {
            currentTab = tabId;
            
            // Update active state on buttons
            document.querySelectorAll('.tab-btn').forEach((btn, index) => {
                if (menuData[index].id === tabId) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            renderMenu();
        }

        // Render Menu Cards
        function renderMenu() {
            const category = menuData.find(c => c.id === currentTab);
            
            // Update Header
            sectionTitle.innerHTML = `<i class="fas ${category.icon} mr-2"></i>${category.title}`;
            sectionNote.textContent = category.note;

            // Clear Grid
            menuGrid.innerHTML = '';

            // Populate Grid
            let lastGroup = null;
            category.items.forEach(item => {
                if (item.group && item.group !== lastGroup) {
                    const heading = document.createElement('h3');
                    heading.className = 'col-span-full text-xl md:text-2xl font-bold text-[#1d3557] border-b-2 border-[#e63946] pt-6 pb-2';
                    heading.textContent = item.group;
                    menuGrid.appendChild(heading);
                    lastGroup = item.group;
                }
                const card = document.createElement('div');
                card.className = 'menu-card bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex flex-col h-full relative overflow-hidden';
                
                // Optional Tag HTML
                let tagsHtml = '';
                if (item.tags && item.tags.length > 0) {
                    tagsHtml = `<div class="flex flex-wrap gap-2 mt-4">
                        ${item.tags.map(tag => `<span class="bg-gray-100 text-gray-600 text-xs font-semibold px-2.5 py-1 rounded-full border border-gray-200">${tag}</span>`).join('')}
                    </div>`;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="text-xl font-bold text-[#1d3557] pr-4">${item.name}</h3>
                        <span class="price-badge text-white font-bold py-1 px-3 rounded-full text-sm shadow-sm whitespace-nowrap">${item.price}</span>
                    </div>
                    <p class="text-gray-600 text-sm flex-grow leading-relaxed">${item.desc}</p>
                    ${tagsHtml}
                `;
                
                menuGrid.appendChild(card);
            });
        }

        // Run on load
        window.onload = () => {
            initTabs();
            renderMenu();
        };
